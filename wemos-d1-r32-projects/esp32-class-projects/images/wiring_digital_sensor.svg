<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="622" viewBox="0 0 1240 622" font-family="Pretendard, Noto Sans CJK KR, sans-serif">
<rect width="1240" height="622" fill="#ffffff"/>
<text x="620.0" y="52" font-size="26" font-weight="bold" fill="#1b2536" text-anchor="middle">디지털 센서 연결 — 진동 · 홀(자석) · 온습도(DHT)</text>
<text x="620.0" y="82" font-size="15" fill="#56677e" text-anchor="middle">점퍼선 3가닥: G → GND · V → 3V3 · S → 디지털 핀 (예: D6 = GPIO27)</text>
<rect x="760" y="130" width="400" height="250" rx="16" fill="#1b2536"/>
<text x="1000.0" y="168" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Wemos D1 R32</text>
<text x="1000.0" y="190" font-size="13" fill="#aab6c8" text-anchor="middle">(ESP32 · 우노 모양 보드)</text>
<rect x="746" y="210" width="210" height="46" rx="8" fill="#e8edf3" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="232" font-size="17" font-weight="bold" fill="#1b2536" text-anchor="start">GND</text>
<rect x="746" y="270" width="210" height="46" rx="8" fill="#e8edf3" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="292" font-size="17" font-weight="bold" fill="#1b2536" text-anchor="start">3V3</text>
<text x="772" y="310" font-size="12" fill="#56677e" text-anchor="start">전원 3.3V</text>
<rect x="746" y="330" width="210" height="46" rx="8" fill="#f5d75d" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="352" font-size="17" font-weight="bold" fill="#3a3000" text-anchor="start">D6  →  GPIO 27</text>
<text x="772" y="370" font-size="12" fill="#5a4a00" text-anchor="start">보드에 IO27로 인쇄된 경우도 있음</text>
<rect x="80" y="130" width="300" height="190" rx="12" fill="#2e7d5b"/>
<text x="210" y="166" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">진동 · 홀 · DHT 센서</text>
<rect x="310" y="181" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="201" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">G</text>
<path d="M380 196 C 563.0 196, 563.0 233.0, 746 233.0" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="310" y="221" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="241" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">V</text>
<path d="M380 236 C 563.0 236, 563.0 293.0, 746 293.0" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="310" y="261" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="281" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">S</text>
<path d="M380 276 C 563.0 276, 563.0 353.0, 746 353.0" fill="none" stroke="#e07b00" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<text x="80" y="398" font-size="13" fill="#56677e" text-anchor="start">선 색: 검정 = GND · 빨강 = 전원 · 주황/파랑 = 신호   (센서 쪽 암 · 보드 쪽 수 — 암-수 점퍼선)</text>
<rect x="80" y="416" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="442" font-size="15" fill="#1b2536" text-anchor="start">① 디지털 핀은 아무 곳이나 — 보드 라벨 → GPIO: D2=26 · D3=25 · D5=16 · D6=27 · D7=14</text>
<rect x="80" y="460" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="486" font-size="15" fill="#1b2536" text-anchor="start">② 진동·홀: digitalRead(핀) (0/1)   ·   DHT: DHT dht(핀, DHT11) + readTemperature()</text>
<rect x="80" y="504" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="530" font-size="15" fill="#1b2536" text-anchor="start">③ 시리얼 모니터(115200)로 관찰 — 책상 두드리기 / 자석 가까이 / 센서에 입김!</text>
<rect x="80" y="548" width="1080" height="38" rx="8" fill="#fdecea"/>
<text x="100" y="574" font-size="15" font-weight="bold" fill="#9a1c12" text-anchor="start">⚠ 코드의 #define 번호는 보드 라벨(D6)이 아니라 GPIO 번호(27)!  D8(GPIO12)은 부팅에 민감하니 비워 두기</text>
</svg>