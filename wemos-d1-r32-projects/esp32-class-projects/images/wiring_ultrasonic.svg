<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="682" viewBox="0 0 1240 682" font-family="Pretendard, Noto Sans CJK KR, sans-serif">
<rect width="1240" height="682" fill="#ffffff"/>
<text x="620.0" y="52" font-size="26" font-weight="bold" fill="#1b2536" text-anchor="middle">초음파 센서 연결 — 신호 2개(TRIG·ECHO)가 필요해요</text>
<text x="620.0" y="82" font-size="15" fill="#56677e" text-anchor="middle">점퍼선 4가닥: GND · VCC · TRIG → D6(GPIO27) · ECHO → D7(GPIO14)</text>
<rect x="760" y="130" width="400" height="310" rx="16" fill="#1b2536"/>
<text x="1000.0" y="168" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Wemos D1 R32</text>
<text x="1000.0" y="190" font-size="13" fill="#aab6c8" text-anchor="middle">(ESP32 · 우노 모양 보드)</text>
<rect x="746" y="210" width="210" height="46" rx="8" fill="#e8edf3" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="232" font-size="17" font-weight="bold" fill="#1b2536" text-anchor="start">GND</text>
<rect x="746" y="270" width="210" height="46" rx="8" fill="#e8edf3" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="292" font-size="17" font-weight="bold" fill="#1b2536" text-anchor="start">5V</text>
<text x="772" y="310" font-size="12" fill="#56677e" text-anchor="start">HC-SR04 등 5V 전용 모듈</text>
<rect x="746" y="330" width="210" height="46" rx="8" fill="#f5d75d" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="352" font-size="17" font-weight="bold" fill="#3a3000" text-anchor="start">D6  →  GPIO 27</text>
<text x="772" y="370" font-size="12" fill="#5a4a00" text-anchor="start">TRIG</text>
<rect x="746" y="390" width="210" height="46" rx="8" fill="#f5d75d" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="412" font-size="17" font-weight="bold" fill="#3a3000" text-anchor="start">D7  →  GPIO 14</text>
<text x="772" y="430" font-size="12" fill="#5a4a00" text-anchor="start">ECHO (분압 후)</text>
<rect x="80" y="130" width="300" height="230" rx="12" fill="#2e7d5b"/>
<text x="210" y="166" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">초음파 거리 센서</text>
<rect x="310" y="181" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="201" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">GND</text>
<path d="M380 196 C 563.0 196, 563.0 233.0, 746 233.0" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="310" y="221" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="241" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">VCC</text>
<path d="M380 236 C 563.0 236, 563.0 293.0, 746 293.0" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="310" y="261" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="281" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">TRIG</text>
<path d="M380 276 C 563.0 276, 563.0 353.0, 746 353.0" fill="none" stroke="#e07b00" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="310" y="301" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="321" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">ECHO</text>
<path d="M380 316 C 563.0 316, 563.0 413.0, 746 413.0" fill="none" stroke="#1e88e5" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="485.0" y="348.5" width="156" height="30" rx="6" fill="#fff3e0" stroke="#e07b00"/>
<text x="563.0" y="369.5" font-size="13" font-weight="bold" fill="#8a4b00" text-anchor="middle">1kΩ+2kΩ 분압</text>
<text x="80" y="458" font-size="13" fill="#56677e" text-anchor="start">선 색: 검정 = GND · 빨강 = 전원 · 주황/파랑 = 신호   (센서 쪽 암 · 보드 쪽 수 — 암-수 점퍼선)</text>
<rect x="80" y="476" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="502" font-size="15" fill="#1b2536" text-anchor="start">① 5V 전용 모듈은 ECHO가 5V로 나와요 → 1kΩ 직렬 + 2kΩ(GND로) 분압을 거쳐 D7에 연결</text>
<rect x="80" y="520" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="546" font-size="15" fill="#1b2536" text-anchor="start">② 3.3V에서 동작하는 모듈이면 VCC → 3V3, ECHO → D7 바로 연결 (분압 생략)</text>
<rect x="80" y="564" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="590" font-size="15" fill="#1b2536" text-anchor="start">③ pulseIn(ECHO, HIGH)로 왕복 시간 → × 0.034 ÷ 2 = 거리(cm) — 자로 실측해서 비교!</text>
<rect x="80" y="608" width="1080" height="38" rx="8" fill="#fdecea"/>
<text x="100" y="634" font-size="15" font-weight="bold" fill="#9a1c12" text-anchor="start">⚠ TRIG·ECHO를 서로 바꿔 꽂으면 항상 0이 나와요 — 안 되면 두 신호선부터 의심!</text>
</svg>