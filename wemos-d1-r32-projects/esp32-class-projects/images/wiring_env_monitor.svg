<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Pretendard, Noto Sans CJK KR, sans-serif">
<rect width="1240" height="780" fill="#ffffff"/>
<text x="620.0" y="52" font-size="26" font-weight="bold" fill="#1b2536" text-anchor="middle">4회차 교실 환경 모니터 — 센서 3개 동시 연결</text>
<text x="620.0" y="82" font-size="15" fill="#56677e" text-anchor="middle">온습도(DHT)는 디지털 핀, 빛·소리는 A2~A5 핀 — 전원(V)은 모두 3V3, G는 모두 GND</text>
<rect x="760" y="130" width="400" height="310" rx="16" fill="#1b2536"/>
<text x="1000.0" y="168" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Wemos D1 R32</text>
<text x="1000.0" y="190" font-size="13" fill="#aab6c8" text-anchor="middle">(ESP32 · 우노 모양 보드)</text>
<rect x="746" y="210" width="210" height="46" rx="8" fill="#f5d75d" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="232" font-size="17" font-weight="bold" fill="#3a3000" text-anchor="start">D11  →  GPIO 23</text>
<text x="772" y="250" font-size="12" fill="#5a4a00" text-anchor="start">#define DHTPIN 23</text>
<rect x="746" y="270" width="210" height="46" rx="8" fill="#f5d75d" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="292" font-size="17" font-weight="bold" fill="#3a3000" text-anchor="start">A3  →  GPIO 34</text>
<text x="772" y="310" font-size="12" fill="#5a4a00" text-anchor="start">#define LIGHT 34</text>
<rect x="746" y="330" width="210" height="46" rx="8" fill="#f5d75d" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="352" font-size="17" font-weight="bold" fill="#3a3000" text-anchor="start">A2  →  GPIO 35</text>
<text x="772" y="370" font-size="12" fill="#5a4a00" text-anchor="start">#define SOUND 35</text>
<rect x="746" y="390" width="210" height="46" rx="8" fill="#e8edf3" stroke="#0f2240" stroke-width="2"/>
<text x="772" y="412" font-size="17" font-weight="bold" fill="#1b2536" text-anchor="start">3V3 · GND</text>
<text x="772" y="430" font-size="12" fill="#56677e" text-anchor="start">세 센서 V·G 공통 연결</text>
<rect x="80" y="130" width="300" height="110" rx="12" fill="#2e7d5b"/>
<text x="210" y="166" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">온습도 (DHT) 센서</text>
<rect x="310" y="181" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="201" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">S</text>
<path d="M380 196 C 563.0 196, 563.0 233.0, 746 233.0" fill="none" stroke="#e07b00" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="80" y="264" width="300" height="110" rx="12" fill="#2e7d5b"/>
<text x="210" y="300" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">빛 센서</text>
<rect x="310" y="315" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="335" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">S</text>
<path d="M380 330 C 563.0 330, 563.0 293.0, 746 293.0" fill="none" stroke="#e07b00" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<rect x="80" y="398" width="300" height="110" rx="12" fill="#2e7d5b"/>
<text x="210" y="434" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">소리 센서</text>
<rect x="310" y="449" width="70" height="28" rx="5" fill="#ffffff"/>
<text x="345" y="469" font-size="14" font-weight="bold" fill="#1b2536" text-anchor="middle">S</text>
<path d="M380 464 C 563.0 464, 563.0 353.0, 746 353.0" fill="none" stroke="#e07b00" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
<text x="80" y="556" font-size="13" fill="#56677e" text-anchor="start">선 색: 검정 = GND · 빨강 = 전원 · 주황/파랑 = 신호   (센서 쪽 암 · 보드 쪽 수 — 암-수 점퍼선)</text>
<rect x="80" y="574" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="600" font-size="15" fill="#1b2536" text-anchor="start">① 세 센서의 S선을 위 핀에 꽂고, 코드의 세 #define 번호가 GPIO와 같은지 확인 (다른 핀이면 번호만 수정)</text>
<rect x="80" y="618" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="644" font-size="15" fill="#1b2536" text-anchor="start">② 빛·소리는 반드시 A2~A5 핀! (A0·A1은 WiFi 켜면 아날로그 불가) · V는 모두 3V3</text>
<rect x="80" y="662" width="1080" height="38" rx="8" fill="#f2f5f9"/>
<text x="100" y="688" font-size="15" fill="#1b2536" text-anchor="start">③ 시리얼 모니터(115200)로 세 값이 다 나오는지 먼저 확인 → 그다음 클라우드 업로드 코드로!</text>
<rect x="80" y="706" width="1080" height="38" rx="8" fill="#fdecea"/>
<text x="100" y="732" font-size="15" font-weight="bold" fill="#9a1c12" text-anchor="start">⚠ DHT 값이 nan이면: 2초에 1번만 측정(delay 2000 이상) + 핀 번호 확인</text>
</svg>