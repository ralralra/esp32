<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="'NanumGothic','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="1020" height="620" fill="#ffffff"/>
  <text x="510" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">RC522 ↔ Wemos D1 R32 배선도 (실드 없이 직접 연결)</text>

  <!-- ── Wemos D1 R32 보드 ── -->
  <rect x="50" y="80" width="520" height="240" rx="10" fill="#1a1a1a"/>
  <text x="310" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#cccccc">Wemos D1 R32</text>
  <text x="310" y="176" text-anchor="middle" font-size="13" fill="#888888">(ESP32 · 우노 모양 보드)</text>

  <!-- 위쪽 전원 헤더: 3V3 -->
  <g>
    <circle cx="500" cy="92" r="5" fill="#e53935"/>
    <text x="500" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#e53935">3V3</text>
    <text x="425" y="76" text-anchor="middle" font-size="12" fill="#666">← 위쪽 전원 헤더</text>
  </g>

  <!-- 아래쪽 디지털 헤더 핀 (실물 인쇄 순서) -->
  <!-- RX0 TX0 IO26 IO25 IO17 IO16 IO27 IO14 IO12 IO13 IO05 IO23 IO19 IO18 GND RST SDA SCL -->
  <g font-size="11" fill="#cccccc">
    <g text-anchor="start">
      <text transform="translate(74,308) rotate(-90)">RX0</text>
      <text transform="translate(102,308) rotate(-90)">TX0</text>
      <text transform="translate(130,308) rotate(-90)">IO26</text>
      <text transform="translate(158,308) rotate(-90)">IO25</text>
      <text transform="translate(186,308) rotate(-90)">IO17</text>
      <text transform="translate(214,308) rotate(-90)">IO16</text>
      <text transform="translate(242,308) rotate(-90)" font-weight="bold" fill="#7cb342">IO27</text>
      <text transform="translate(270,308) rotate(-90)">IO14</text>
      <text transform="translate(298,308) rotate(-90)">IO12</text>
      <text transform="translate(326,308) rotate(-90)">IO13</text>
      <text transform="translate(354,308) rotate(-90)" font-weight="bold" fill="#e91e9c">IO05</text>
      <text transform="translate(382,308) rotate(-90)" font-weight="bold" fill="#fb8c00">IO23</text>
      <text transform="translate(410,308) rotate(-90)" font-weight="bold" fill="#8e24aa">IO19</text>
      <text transform="translate(438,308) rotate(-90)" font-weight="bold" fill="#29b6f6">IO18</text>
      <text transform="translate(466,308) rotate(-90)" font-weight="bold" fill="#9e9e9e">GND</text>
      <text transform="translate(494,308) rotate(-90)">RST</text>
      <text transform="translate(522,308) rotate(-90)">SDA</text>
      <text transform="translate(550,308) rotate(-90)">SCL</text>
    </g>
    <!-- 핀 구멍 -->
    <g fill="#e8e8e8">
      <circle cx="70" cy="313" r="4"/><circle cx="98" cy="313" r="4"/><circle cx="126" cy="313" r="4"/>
      <circle cx="154" cy="313" r="4"/><circle cx="182" cy="313" r="4"/><circle cx="210" cy="313" r="4"/>
      <circle cx="238" cy="313" r="4" fill="#7cb342"/><circle cx="266" cy="313" r="4"/><circle cx="294" cy="313" r="4"/>
      <circle cx="322" cy="313" r="4"/><circle cx="350" cy="313" r="4" fill="#e91e9c"/><circle cx="378" cy="313" r="4" fill="#fb8c00"/>
      <circle cx="406" cy="313" r="4" fill="#8e24aa"/><circle cx="434" cy="313" r="4" fill="#29b6f6"/><circle cx="462" cy="313" r="4" fill="#9e9e9e"/>
      <circle cx="490" cy="313" r="4"/><circle cx="518" cy="313" r="4"/><circle cx="546" cy="313" r="4"/>
    </g>
  </g>

  <!-- 함정 경고 -->
  <g font-size="11.5" fill="#c62828">
    <text x="519" y="340" text-anchor="middle">주의! 여기 RST·SDA에</text>
    <text x="519" y="355" text-anchor="middle">꽂으면 안 됨!</text>
  </g>

  <!-- ── RC522 모듈 ── -->
  <rect x="660" y="80" width="310" height="240" rx="10" fill="#1565c0"/>
  <text x="815" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">RFID-RC522</text>
  <text x="815" y="176" text-anchor="middle" font-size="13" fill="#bbdefb">(13.56MHz 리더기)</text>

  <!-- RC522 핀: SDA SCK MOSI MISO IRQ GND RST 3.3V -->
  <g font-size="11" font-weight="bold">
    <g text-anchor="start">
      <text transform="translate(689,308) rotate(-90)" fill="#ffd6f2">SDA</text>
      <text transform="translate(726,308) rotate(-90)" fill="#c9ecff">SCK</text>
      <text transform="translate(763,308) rotate(-90)" fill="#ffe0b2">MOSI</text>
      <text transform="translate(800,308) rotate(-90)" fill="#e1bee7">MISO</text>
      <text transform="translate(837,308) rotate(-90)" fill="#90a4ae">IRQ</text>
      <text transform="translate(874,308) rotate(-90)" fill="#eeeeee">GND</text>
      <text transform="translate(911,308) rotate(-90)" fill="#dcedc8">RST</text>
      <text transform="translate(948,308) rotate(-90)" fill="#ffcdd2">3.3V</text>
    </g>
    <g fill="#e8e8e8">
      <circle cx="685" cy="313" r="4" fill="#e91e9c"/><circle cx="722" cy="313" r="4" fill="#29b6f6"/>
      <circle cx="759" cy="313" r="4" fill="#fb8c00"/><circle cx="796" cy="313" r="4" fill="#8e24aa"/>
      <circle cx="833" cy="313" r="4" fill="#78909c"/><circle cx="870" cy="313" r="4" fill="#9e9e9e"/>
      <circle cx="907" cy="313" r="4" fill="#7cb342"/><circle cx="944" cy="313" r="4" fill="#e53935"/>
    </g>
  </g>
  <text x="833" y="345" text-anchor="middle" font-size="11" fill="#78909c">IRQ는 연결 안 함</text>

  <!-- ── 배선 (색깔 선) ── -->
  <g fill="none" stroke-width="3.5" stroke-linejoin="round">
    <!-- GND 회색: IO옆 GND(462) → 램프 y=385 → RC522 GND(870) -->
    <polyline stroke="#9e9e9e" points="462,317 462,385 870,385 870,317"/>
    <!-- SDA 핑크: IO05(350) → y=415 → RC522 SDA(685) -->
    <polyline stroke="#e91e9c" points="350,317 350,415 685,415 685,317"/>
    <!-- SCK 파랑: IO18(434) → y=445 → RC522 SCK(722) -->
    <polyline stroke="#29b6f6" points="434,317 434,445 722,445 722,317"/>
    <!-- MOSI 주황: IO23(378) → y=475 → RC522 MOSI(759) -->
    <polyline stroke="#fb8c00" points="378,317 378,475 759,475 759,317"/>
    <!-- MISO 보라: IO19(406) → y=505 → RC522 MISO(796) -->
    <polyline stroke="#8e24aa" points="406,317 406,505 796,505 796,317"/>
    <!-- RST 초록: IO27(238) → y=535 → RC522 RST(907) -->
    <polyline stroke="#7cb342" points="238,317 238,535 907,535 907,317"/>
    <!-- 3.3V 빨강: 3V3(500,88) → 위로 → 오른쪽 벽 → y=565 → RC522 3.3V(944) -->
    <polyline stroke="#e53935" points="500,88 500,56 996,56 996,565 944,565 944,317"/>
  </g>

  <!-- 연결표 요약 -->
  <g font-size="13" fill="#333">
    <text x="60" y="415" fill="#9e9e9e" font-weight="bold">GND → GND</text>
    <text x="60" y="440" fill="#e91e9c" font-weight="bold">IO05 → SDA(SS)</text>
    <text x="60" y="465" fill="#29b6f6" font-weight="bold">IO18 → SCK</text>
    <text x="60" y="490" fill="#fb8c00" font-weight="bold">IO23 → MOSI</text>
    <text x="60" y="515" fill="#8e24aa" font-weight="bold">IO19 → MISO</text>
    <text x="60" y="540" fill="#7cb342" font-weight="bold">IO27 → RST</text>
    <text x="60" y="565" fill="#e53935" font-weight="bold">3V3 → 3.3V  (5V 절대 금지!)</text>
  </g>

  <text x="510" y="600" text-anchor="middle" font-size="12" fill="#888">RC522의 SDA는 보드의 SDA(I2C)가 아니라 IO05에, RC522의 RST는 보드의 RST가 아니라 IO27에 연결합니다.</text>
</svg>
